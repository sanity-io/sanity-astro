packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  'braces@<3.0.3': '>=3.0.3'
  'ws@>=8.0.0 <8.17.1': '>=8.22.0'
  # GHSA-p4f5-76q4-ffq7: Vite 8 dev-server RCE / server.fs bypass
  'vite@>=8.0.0 <8.3.7': '8.3.8'

allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  # Only pulled in by the ailf eval tooling (promptfoo), which installs with --ignore-scripts
  '@playwright/browser-chromium': false
  better-sqlite3: false
  core-js-pure: false
  onnxruntime-node: false
  protobufjs: false

# First-party release this repo adopts on publish day; pnpm's default minimumReleaseAge would block it for 24h
minimumReleaseAgeExclude:
  - '@sanity/client@8.11.0'
  - '@sanity/image-url@2.2.0'
  - '@sanity/access-ui@7.0.0-next-major.20261127112435'
  - '@sanity/diff@7.0.0-next-major.20261127112435'
  - '@sanity/mutator@7.0.0-next-major.20261127112435'
  - '@sanity/schema@7.0.0-next-major.20261127112435'
  - '@sanity/types@7.0.0-next-major.20261127112435'
  - '@sanity/util@7.0.0-next-major.20261127112435'
  - '@sanity/validation@7.0.0-next-major.20261127112435'
  - '@sanity/vision@7.0.0-next-major.20261127112435'
  - groq@7.0.0-next-major.20261127112435
  - sanity@7.0.0-next-major.20261127112435
  - '@portabletext/editor@8.2.17'
  - '@portabletext/html@2.0.4'
  - '@portabletext/keyboard-shortcuts@3.0.2'
  - '@portabletext/patches@4.0.0'
  - '@portabletext/plugin-character-pair-decorator@9.0.31'
  - '@portabletext/plugin-dnd@2.0.32'
  - '@portabletext/plugin-input-rule@7.0.31'
  - '@portabletext/plugin-list-index@2.0.30'
  - '@portabletext/plugin-markdown-shortcuts@9.0.31'
  - '@portabletext/plugin-one-line@8.0.30'
  - '@portabletext/plugin-paste-link@5.0.30'
  - '@portabletext/plugin-table@2.0.30'
  - '@portabletext/plugin-typography@9.0.31'
  - '@portabletext/react@8.0.2'
  - '@portabletext/repair@1.0.6'
  - '@portabletext/sanity-bridge@5.0.2'
  - '@portabletext/schema@3.1.2'
  - '@portabletext/toolkit@6.1.1'
  - '@portabletext/types@4.0.3'
  - '@sanity/sdk-react@3.17.0'
  - '@sanity/sdk@3.17.0'
  - '@sanity/ui@4.4.13'
