name: Dedupe lockfile

on:
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}

permissions:
  contents: read

jobs:
  run:
    name: Can pnpm-lock.yaml be deduped? 🤔
    runs-on: ubuntu-latest
    # workflow_dispatch lets you pick any branch, but this should only ever run on main
    if: ${{ github.ref_name == 'main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: pnpm dedupe --config.ignore-scripts=true
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.ECOSPARK_APP_ID }}
          private-key: ${{ secrets.ECOSPARK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          body: I ran `pnpm dedupe` 🧑‍💻
          branch: actions/dedupe-if-needed
          commit-message: 'chore(deps): dedupe pnpm-lock.yaml'
          labels: 🤖 bot
          sign-commits: true
          title: 'chore(deps): dedupe pnpm-lock.yaml'
          token: ${{ steps.generate-token.outputs.token }}
